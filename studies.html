<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eerdere Schriftstudies | Sacra Scientia</title>
    <!-- PDF bibliotheek voor de downloadfunctie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* (Houd je bestaande styling aan, voeg alleen onderstaande toe) */
        .download-btn {
            margin-top: 1rem;
            background: #f59e0b;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            color: #0f172a;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- (Gebruik je bestaande navigatie en layout van studies.html) -->
    
    <main class="container">
        <div class="page-header">
            <h1>Archief Schriftstudies</h1>
            <p>Lees alle voorgaande dagelijkse overdenkingen terug.</p>
        </div>
        <div id="studies-container">
            <p style="text-align: center; color: #94a3b8;">Archief wordt geladen...</p>
        </div>
    </main>

    <script>
        const { jsPDF } = window.jspdf;

        async function loadArchiveStudies() {
            try {
                // VERVANG HIERONDER DOOR JOUW GITHUB GEGEVENS
                const repo = DHDvdW/SacraScientia;
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/studies`);
                const files = await response.json();
                
                // Sorteer op bestandsnaam (datum), nieuwste bovenaan
                files.sort((a, b) => b.name.localeCompare(a.name));

                const container = document.getElementById('studies-container');
                container.innerHTML = "";

                for (const file of files) {
                    if (file.name.endsWith('.json')) {
                        const studyRes = await fetch(file.download_url);
                        const data = await studyRes.json();
                        
                        const article = document.createElement('article');
                        article.className = 'study-card';
                        
                        // Formatteer tekst naar HTML paragrafen
                        const contentHtml = data.text.split('\n').map(p => `<p style="margin-bottom: 1.2rem;">${p}</p>`).join('');
                        
                        article.innerHTML = `
                            <div class="study-date">Datum: ${data.date}</div>
                            ${contentHtml}
                            <button class="download-btn" onclick="downloadPDF('${data.date}', \`${data.text.replace(/`/g, '\\`')}\`)">Download als PDF</button>
                        `;
                        container.appendChild(article);
                    }
                }
            } catch (error) {
                document.getElementById('studies-container').innerHTML = '<p style="text-align: center;">Kan archief niet laden.</p>';
            }
        }

        function downloadPDF(date, text) {
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text("Schriftstudie - " + date, 10, 20);
            doc.setFontSize(12);
            const splitText = doc.splitTextToSize(text, 180);
            doc.text(splitText, 10, 40);
            doc.save(`Studie_${date}.pdf`);
        }

        loadArchiveStudies();
    </script>
</body>
</html>
