<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eerdere Schriftstudies & Archief | Sacra Scientia</title>
    <!-- jsPDF bibliotheek voor de PDF-generatie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; color: #f8fafc; background-color: #0b0f19; line-height: 1.7; font-size: 18px; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Cinzel', serif; letter-spacing: 0.5px; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 60%, #090d16 100%); }
        .overlay-grid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0); background-size: 32px 32px; z-index: -1; pointer-events: none; }
        
        /* NAVIGATIE */
        nav { position: sticky; top: 0; width: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3rem; font-weight: 700; color: #f59e0b; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 28px; height: 28px; background: #d97706; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s ease; }
        .nav-links a:hover { color: #f59e0b; }

        .container { max-width: 900px; margin: 0 auto; padding: 4rem 1.5rem; }
        .page-header { text-align: center; margin-bottom: 3.5rem; }
        .page-header h1 { color: #ffffff; margin-bottom: 1rem; font-size: 3rem; }
        
        .study-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 2.5rem; margin-bottom: 2.5rem; backdrop-filter: blur(8px); border-left: 4px solid #f59e0b; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .study-date { font-size: 0.85rem; color: #f59e0b; text-transform: uppercase; margin-bottom: 1rem; font-weight: 600; }
        
        .quiz-box { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; padding: 1.5rem; margin-top: 1.5rem; }
        .quiz-box h4 { color: #f59e0b; margin-bottom: 0.8rem; font-size: 1.1rem; }

        .download-btn { margin-top: 1.5rem; background: #f59e0b; border: none; padding: 0.7rem 1.4rem; border-radius: 6px; cursor: pointer; font-weight: 700; color: #0f172a; display: inline-block; transition: 0.3s; }
        .download-btn:hover { background: #d97706; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div id="bg-canvas"></div>
    <div class="overlay-grid"></div>

    <!-- VASTE NAVIGATIE (Gouden Draad) -->
    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon"></div>
            <span>Sacra Scientia</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="studies.html" style="color: #f59e0b; font-weight: 700;">Archief & Studies</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Archief Schriftstudies</h1>
            <p>Lees alle voorgaande overdenkingen terug, inclusief inzichtvragen en PDF-downloads.</p>
        </div>
        <div id="studies-container">
            <p style="text-align: center; color: #94a3b8;">Archief wordt geladen...</p>
        </div>
    </main>

    <script>
        const { jsPDF } = window.jspdf;

        async function loadArchiveStudies() {
            try {
                // VERVANG HIERONDER EVENTUEEL JE GITHUB REPO (gebruiker/reponaam)
                const repo = "DHDvdW/SacraScientia"; 
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/studies`);
                const files = await response.json();
                
                files.sort((a, b) => b.name.localeCompare(a.name));

                const container = document.getElementById('studies-container');
                container.innerHTML = "";

                for (const file of files) {
                    if (file.name.endsWith('.json')) {
                        const studyRes = await fetch(file.download_url);
                        const data = await studyRes.json();
                        
                        const article = document.createElement('article');
                        article.className = 'study-card';
                        
                        const contentHtml = data.text ? data.text.split('\n').map(p => `<p style="margin-bottom: 1.2rem;">${p}</p>`).join('') : '<p>Geen inhoud.</p>';
                        
                        let quizHtml = "";
                        if (data.quiz) {
                            quizHtml = `
                                <div class="quiz-box">
                                    <h4>Inzichtvragen</h4>
                                    <p style="white-space: pre-line; color: #cbd5e1; font-size: 0.95rem;">${data.quiz}</p>
                                </div>
                            `;
                        }

                        // Veilige data doorgifte naar de PDF-generator
                        const safeText = (data.text || "").replace(/`/g, '\\`');
                        const safeQuiz = (data.quiz || "").replace(/`/g, '\\`');
                        const safeAnswers = (data.answers || "Geen antwoorden beschikbaar").replace(/`/g, '\\`');
                        
                        article.innerHTML = `
                            <div class="study-date">Datum: ${data.date || 'Onbekend'}</div>
                            ${contentHtml}
                            ${quizHtml}
                            <button class="download-btn" onclick="downloadPDF('${data.date}', \`${safeText}\`, \`${safeQuiz}\`, \`${safeAnswers}\`)">Download als PDF (met spiegelbeeld antwoorden)</button>
                        `;
                        container.appendChild(article);
                    }
                }
            } catch (error) {
                console.error(error);
                document.getElementById('studies-container').innerHTML = '<p style="text-align: center; color: #94a3b8;">Kan archief niet laden. Zorg dat de map "studies" op GitHub bestaat.</p>';
            }
        }

        function downloadPDF(date, text, quiz, answers) {
            const doc = new jsPDF();
            
            // Pagina 1: Studie + Quizvragen
            doc.setFontSize(16);
            doc.text("Sacra Scientia - Schriftstudie (" + date + ")", 10, 15);
            
            doc.setFontSize(10);
            const splitText = doc.splitTextToSize(text, 180);
            doc.text(splitText, 10, 25);
            
            if (quiz) {
                doc.addPage();
                doc.setFontSize(14);
                doc.text("Inzichtvragen", 10, 20);
                doc.setFontSize(10);
                doc.text(doc.splitTextToSize(quiz, 180), 10, 30);
            }

            // Spiegelbeeld antwoorden onderaan of op een aparte sectie (180 graden gedraaid)
            doc.setFontSize(8);
            doc.setTextColor(150);
            doc.text("--- ONDERSTAANDE ANTWOORDEN STAAN IN SPIEGELBEELD ---", 105, 270, { align: 'center' });
            doc.text(doc.splitTextToSize("Antwoorden: \n" + answers, 180), 105, 280, { align: 'center', angle: 180 });

            doc.save(`Studie_${date}.pdf`);
        }

        loadArchiveStudies();
    </script>
</body>
</html>
