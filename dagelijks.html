<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Het Woord voor Vandaag | Sacra Scientia</title>
    <!-- jsPDF voor professionele PDF generatie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0b0f19;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #d97706;
            --accent-hover: #b45309;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-main); background-color: var(--bg-primary);
            line-height: 1.8; font-size: 17px;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; color: #fff; }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 60%, #070a11 100%);
        }

        nav {
            position: sticky; top: 0; width: 100%;
            background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color); z-index: 1000;
            padding: 1.2rem 2.5rem; display: flex; justify-content: space-between; align-items: center;
        }

        .logo {
            font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700; color: var(--accent);
            text-decoration: none; display: flex; align-items: center; gap: 12px;
        }
        .logo-icon { width: 24px; height: 24px; background: var(--accent); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }

        .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }

        .container { max-width: 850px; margin: 0 auto; padding: 4rem 1.5rem; }

        .study-article {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 3.5rem; backdrop-filter: blur(12px);
            border-left: 5px solid var(--accent); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            margin-bottom: 3rem;
        }

        .study-date { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 1.5rem; }
        .study-article p { margin-bottom: 1.5rem; color: #cbd5e1; text-align: justify; }

        .quiz-section {
            background: rgba(11, 15, 25, 0.95); border: 1px solid rgba(217, 119, 6, 0.4);
            border-radius: 10px; padding: 2.5rem; margin-top: 3.5rem;
        }
        .quiz-section h3 { color: var(--accent); margin-bottom: 1.5rem; font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }

        .btn-download {
            background: var(--accent); color: #0b0f19; border: none;
            padding: 1rem 2.2rem; border-radius: 8px; font-weight: 600; cursor: pointer;
            display: inline-block; transition: all 0.3s ease; margin-top: 2.5rem; font-size: 1rem;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }
        .btn-download:hover { background: var(--accent-hover); transform: translateY(-2px); }

        footer { background: #070a11; border-top: 1px solid var(--border-color); padding: 3rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>

    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon"></div>
            <span>Sacra Scientia</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dagelijks.html" class="active">Dagelijkse Studie</a></li>
            <li><a href="studies.html">Archief</a></li>
        </ul>
    </nav>

    <main class="container">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1>Het Woord voor Vandaag</h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">De dagelijkse exegese, verdieping en inzichtquiz.</p>
        </div>

        <div id="daily-content">
            <div class="study-article">
                <p style="text-align: center; color: var(--text-muted);">De dagelijkse overdenking wordt geladen...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>Sacra Scientia &copy; 2026</p>
    </footer>

    <script>
        async function loadDailyStudyPage() {
            const container = document.getElementById('daily-content');
            try {
                const repo = "DHDvdW/SacraScientia"; 
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/studies?` + new Date().getTime());
                
                if (!res.ok) {
                    throw new Error("Kan de map 'studies' op GitHub niet bereiken.");
                }
                
                const files = await res.json();
                files.sort((a, b) => b.name.localeCompare(a.name));

                const latestFile = files.find(f => f.name.endsWith('.json'));
                if (!latestFile) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Er zijn nog geen studies gepubliceerd in het archief.</p>';
                    return;
                }

                const studyRes = await fetch(latestFile.download_url);
                const data = await studyRes.json();
                
                const textHtml = data.text ? data.text.split('\n').map(p => `<p>${p}</p>`).join('') : '<p>Geen tekst gevonden.</p>';
                
                let quizHtml = "";
                if (data.quiz) {
                    quizHtml = `
                        <div class="quiz-section">
                            <h3>Inzichtquiz</h3>
                            <div style="color: #cbd5e1; line-height: 1.8; white-space: pre-line;">${data.quiz}</div>
                        </div>`;
                } else {
                    quizHtml = `
                        <div class="quiz-section">
                            <h3>Inzichtquiz</h3>
                            <p style="color: var(--text-muted);">Voor deze studie is nog geen quiz gegenereerd.</p>
                        </div>`;
                }

                container.innerHTML = `
                    <article class="study-article">
                        <div class="study-date">Gepubliceerd op: ${data.date || 'Onbekend'}</div>
                        ${textHtml}
                        ${quizHtml}
                        <button class="btn-download" id="pdf-btn">Download als PDF (inclusief quiz & spiegel-antwoorden)</button>
                    </article>
                `;

                document.getElementById('pdf-btn').addEventListener('click', () => {
                    generatePDF(data.date || 'studie', data.text || '', data.quiz || '', data.answers || 'Geen antwoorden beschikbaar');
                });

            } catch (e) {
                console.error(e);
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">De studie voor vandaag kon niet worden geladen. Controleer of de map "studies" op GitHub bestaat.</p>';
            }
        }
function generatePDF(date, text, quiz, answers) {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4', putOnlyUsedFonts: true, floatPrecision: 2 });
                
                let y = 20;
                const margin = 18;
                const pageWidth = 210;
                const contentWidth = pageWidth - (margin * 2);
                const lineHeight = 5.5;

                // Radicalere opschoning: verwijdert alle dubbele spaties, regeleinde-breuken en opmaakrestanten
                function cleanTextForPDF(str) {
                    if (!str) return "";
                    return str
                        .replace(/\*/g, "")                          // Verwijder sterretjes
                        .replace(/[^\x00-\x7F\u00A0-\u00FF\u0100-\u017F]/g, " ") // Vervang rare tekens
                        .replace(/[ \t]+/g, " ")                     // Dwing exact één spatie af tussen woorden (voorkomt uitrekenfouten)
                        .replace(/\r/g, "")
                        .trim();
                }

                const cleanContent = cleanTextForPDF(text);
                const cleanQuizContent = cleanTextForPDF(quiz);
                const cleanAnswersContent = cleanTextForPDF(answers && answers !== "undefined" ? answers : "Geen antwoorden beschikbaar.");

                // --- PAGINA 1: KOPTEKST & HOOFDTEKST ---
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(14);
                doc.setTextColor(217, 119, 6);
                doc.text("Sacra Scientia — Schriftstudie", margin, y);
                
                doc.setFont("Helvetica", "italic");
                doc.setFontSize(9);
                doc.setTextColor(100);
                doc.text("Gepubliceerd op: " + date, margin, y + 5);
                y += 15;

                // We brekken de tekst op in alinea's via echte regeleinden
                const rawParagraphs = text.split('\n');
                
                doc.setFont("Helvetica", "normal");
                doc.setFontSize(9.5);
                doc.setTextColor(40);

                for (let i = 0; i < rawParagraphs.length; i++) {
                    const para = cleanTextForPDF(rawParagraphs[i]);
                    if (para === "") {
                        y += 3; // Witregel
                        continue;
                    }

                    // Controleer of het een titel of bijbelvers is (korte regel)
                    const isHeading = para.length < 70 && !para.endsWith('.');
                    if (isHeading) {
                        doc.setFont("Helvetica", "bold");
                        doc.setFontSize(10.5);
                        doc.setTextColor(217, 119, 6);
                        y += 2;
                    } else {
                        doc.setFont("Helvetica", "normal");
                        doc.setFontSize(9.5);
                        doc.setTextColor(40);
                    }

                    // Gebruik dwingende links-uitlijning via opties om uitrekken te voorkomen
                    const splitLines = doc.splitTextToSize(para, contentWidth);
                    for (let j = 0; j < splitLines.length; j++) {
                        if (y > 270) {
                            doc.addPage();
                            y = 20;
                        }
                        // Cruciaal: { align: 'left' } voorkomt dat jsPDF de regels uitrekt over de breedte!
                        doc.text(splitLines[j], margin, y, { align: 'left' });
                        y += lineHeight;
                    }
                    if (isHeading) y += 2;
                }

                // --- PAGINA 2: QUIZ (indien aanwezig) ---
                if (cleanQuizContent) {
                    doc.addPage();
                    y = 20;

                    doc.setFont("Helvetica", "bold");
                    doc.setFontSize(12);
                    doc.setTextColor(217, 119, 6);
                    doc.text("Inzichtvragen", margin, y);
                    y += 10;

                    const quizLines = cleanQuizContent.split('\n');
                    doc.setFont("Helvetica", "normal");
                    doc.setFontSize(9.5);
                    doc.setTextColor(40);

                    for (let i = 0; i < quizLines.length; i++) {
                        const qLine = cleanTextForPDF(quizLines[i]);
                        if (qLine === "") {
                            y += 3;
                            continue;
                        }

                        const splitQuizLines = doc.splitTextToSize(qLine, contentWidth);
                        for (let j = 0; j < splitQuizLines.length; j++) {
                            if (y > 270) {
                                doc.addPage();
                                y = 20;
                            }
                            doc.text(splitQuizLines[j], margin, y, { align: 'left' });
                            y += lineHeight;
                        }
                    }
                }

                // --- PAGINA 3: ANTWOORDEN (Op een eigen, strakke pagina) ---
                doc.addPage();
                let ansY = 30;

                doc.setFont("Helvetica", "bold");
                doc.setFontSize(10);
                doc.setTextColor(120);
                doc.text("--- ANTWOORDEN (DRAAI DE PAGINA OM) ---", pageWidth / 2, ansY, { align: 'center' });
                ansY += 15;

                doc.setFont("Helvetica", "normal");
                doc.setFontSize(9);
                doc.setTextColor(50);

                const splitAnswers = doc.splitTextToSize(cleanAnswers, contentWidth);
                for (let k = 0; k < splitAnswers.length; k++) {
                    doc.text(splitAnswers[k], margin, ansY, { align: 'left' });
                    ansY += lineHeight;
                }

                doc.save(`Studie_${date}.pdf`);
            } catch (err) {
                alert("Fout bij genereren PDF: " + err.message);
            }
        }
        loadDailyStudyPage();
    </script>
</body>
</html>
