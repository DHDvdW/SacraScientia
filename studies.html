<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eerdere Schriftstudies | Sacra Scientia</title>
    <meta name="description" content="Lees alle dagelijkse schriftstudies en diepgaande exegetische overdenkingen terug.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            background-color: #0b0f19;
            line-height: 1.7;
            font-size: 18px;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 60%, #090d16 100%);
        }

        .overlay-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 32px 32px;
            z-index: -1;
            pointer-events: none;
        }

        nav {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f59e0b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: #d97706;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #f59e0b;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .page-header h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .study-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(8px);
            border-left: 4px solid #f59e0b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .study-date {
            font-size: 0.85rem;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        footer {
            background: #070a11;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem 1.5rem;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 5rem;
        }

        footer a {
            color: #94a3b8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>
    <div class="overlay-grid"></div>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon"></div>
            <span>Sacra Scientia</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="studies.html" style="color: #f59e0b; font-weight: 700;">Eerdere Studies</a></li>
        </ul>
    </nav>

    <!-- CONTENT CONTAINER -->
    <main class="container">
        <div class="page-header">
            <h1>Archief Schriftstudies</h1>
            <p>Een overzicht van de dagelijkse exegetische overdenkingen en nuchtere Schriftanalyses.</p>
        </div>

        <div id="studies-container">
            <div class="study-card">
                <p style="text-align: center; color: #94a3b8;">De studies worden ingeladen...</p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container" style="padding: 0;">
            <p style="margin-bottom: 1rem; color: #94a3b8; font-family: 'Cinzel', serif; font-weight: 700;">De Wetenschap van Gods Rechtvaardigheid</p>
            <p>&copy; 2026 Sacra Scientia Evangelisatie. Alle rechten voorbehouden.</p>
        </div>
    </footer>

    <!-- SCRIPT OM STUDIE IN TE LADEN -->
    <script>
        async function loadArchiveStudies() {
            try {
                const response = await fetch('./dagelijkse-studie.json?' + new Date().getTime());
                if (response.ok) {
                    const data = await response.json();
                    
                    let rawText = "";
                    let pubDate = "Recente Overdenking";

                    if (data.text) {
                        rawText = data.text;
                    } else if (data.content) {
                        try {
                            const binString = atob(data.content);
                            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
                            rawText = new TextDecoder().decode(bytes);
                        } catch (e) {
                            rawText = data.content;
                        }
                    }

                    if (data.updated) {
                        const d = new Date(data.updated);
                        pubDate = d.toLocaleDateString('nl-NL', { year: 'numeric', month: 'long', day: 'numeric' });
                    }

                    if (rawText.trim() !== "") {
                        const paragraphs = rawText.split('\n').filter(p => p.trim() !== '');
                        const formattedHtml = paragraphs.map(p => `<p style="margin-bottom: 1.2rem; color: #cbd5e1; line-height: 1.8;">${p}</p>`).join('');
                        
                        document.getElementById('studies-container').innerHTML = `
                            <article class="study-card">
                                <div class="study-date">Gepubliceerd op: ${pubDate}</div>
                                ${formattedHtml}
                            </article>
                        `;
                    } else {
                        document.getElementById('studies-container').innerHTML = '<p style="text-align: center; color: #94a3b8;">Er zijn nog geen studies beschikbaar in het archief.</p>';
                    }
                } else {
                    document.getElementById('studies-container').innerHTML = '<p style="text-align: center; color: #94a3b8;">Kan het archief momenteel niet laden.</p>';
                }
            } catch (error) {
                document.getElementById('studies-container').innerHTML = '<p style="text-align: center; color: #94a3b8;">Fout bij het laden van het archief.</p>';
            }
        }
        loadArchiveStudies();
    </script>
</body>
</html>
